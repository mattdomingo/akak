<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Join the Acacia Wisconsin PNM waitlist.">
    <title>PNM Waitlist | Acacia Wisconsin</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #090909;
        color: #f8f4e8;
        display: flex;
        font-family: Georgia, serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
      }
      main { border: 1px solid #b08d57; max-width: 42rem; padding: 2.5rem; width: 100%; }
      .eyebrow { color: #d6b56c; font: 700 .8rem/1.2 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
      h1 { font-size: clamp(2.25rem, 7vw, 4rem); margin: .5rem 0 1rem; }
      p { color: #ddd5c4; font: 1.1rem/1.6 Arial, sans-serif; }
      a {
        background: #b08d57;
        color: #090909;
        display: inline-block;
        font: 700 .9rem Arial, sans-serif;
        letter-spacing: .08em;
        margin-top: 1rem;
        padding: .9rem 1.25rem;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:hover, a:focus-visible { background: #d6b56c; outline: 2px solid #f8f4e8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Acacia Fraternity · Wisconsin</div>
      <h1>PNM Waitlist</h1>
      <p>Interested in learning more about Acacia at Wisconsin? Add your name to the prospective new member waitlist and our chapter will be in touch.</p>
      <a href="mailto:recruitment@acaciawi.org?subject=PNM%20Waitlist%20Interest">Join the PNM waitlist</a>
    </main>
  </body>
</html>
